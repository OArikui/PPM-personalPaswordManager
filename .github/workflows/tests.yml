name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PyQt application import
        run: python -c "import password_manager"
      - name: Construct the main window
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from PyQt6.QtWidgets import QApplication
          from password_manager import PasswordManagerWindow
          from password_manager_core import Vault
          app = QApplication([])
          with tempfile.TemporaryDirectory() as directory:
              vault = Vault(Path(directory) / "smoke.pwm")
              vault.create("ci smoke test password")
              window = PasswordManagerWindow(vault)
              window.close()
          PY
      - name: Run unit tests
        run: python -m unittest discover -v
